<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="tile" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#251E3C"/>
      <stop offset="1" stop-color="#14111D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(470 430) rotate(90) scale(430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6D5BFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#6D5BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blue" x1="286" y1="330" x2="536" y2="636" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9BC2FF"/>
      <stop offset="0.45" stop-color="#5A87FF"/>
      <stop offset="1" stop-color="#2F51D6"/>
    </linearGradient>
    <linearGradient id="blueDeep" x1="348" y1="520" x2="516" y2="642" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3F6DF1"/>
      <stop offset="1" stop-color="#223FB0"/>
    </linearGradient>
    <linearGradient id="tail" x1="632" y1="664" x2="922" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2B49C9"/>
      <stop offset="0.55" stop-color="#4C7BFF"/>
      <stop offset="1" stop-color="#9BC7FF"/>
    </linearGradient>
    <linearGradient id="tailEdge" x1="610" y1="690" x2="900" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20379B"/>
      <stop offset="1" stop-color="#6E9BFF"/>
    </linearGradient>
    <linearGradient id="wing" x1="486" y1="506" x2="690" y2="742" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D08C60"/>
      <stop offset="0.52" stop-color="#A95E3A"/>
      <stop offset="1" stop-color="#743A27"/>
    </linearGradient>
    <linearGradient id="wingLight" x1="530" y1="512" x2="662" y2="688" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E3A576" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#C07C51" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cream" x1="466" y1="610" x2="572" y2="790" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7E3C5"/>
      <stop offset="1" stop-color="#D6AF86"/>
    </linearGradient>
    <linearGradient id="branch" x1="188" y1="790" x2="832" y2="790" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4B3550"/>
      <stop offset="0.55" stop-color="#2E2039"/>
      <stop offset="1" stop-color="#4B3550"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#tile)"/>
  <circle cx="470" cy="430" r="430" fill="url(#glow)"/>

  <!-- branch -->
  <path d="M150 818C335 786 618 806 878 752" stroke="url(#branch)" stroke-width="32" stroke-linecap="round"/>
  <path d="M676 790C720 748 764 716 818 698" stroke="#3B2A45" stroke-width="18" stroke-linecap="round"/>

  <!-- tail -->
  <path d="M612 682C680 616 766 514 856 398C844 484 806 572 746 654C710 700 674 724 642 732Z" fill="url(#tailEdge)" opacity="0.9"/>
  <path d="M626 660C704 580 804 456 924 300C898 420 846 548 770 646C728 700 682 728 638 742Z" fill="url(#tail)"/>
  <path d="M650 672C716 598 792 500 880 392C846 490 800 584 738 660C706 698 676 718 650 728Z" fill="#82AAFF" opacity="0.55"/>

  <!-- body -->
  <path d="M432 548C472 496 552 478 620 514C682 548 710 616 692 680C674 746 600 786 522 776C446 766 398 706 406 636C410 600 416 570 432 548Z" fill="url(#wing)"/>
  <path d="M444 626C462 592 504 582 540 604C586 632 604 690 584 738C566 780 518 798 476 780C432 760 410 710 420 670C426 652 434 638 444 626Z" fill="url(#cream)"/>

