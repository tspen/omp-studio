  <path d="M330 474C358 452 390 442 426 446C456 450 478 462 492 482C466 490 440 508 420 534C396 526 366 506 330 474Z" fill="#6D9AFF" opacity="0.9"/>

  <!-- beak -->
  <path d="M296 408L218 432L296 448Z" fill="#121019"/>
  <path d="M292 418L236 432L292 436Z" fill="#3C334A" opacity="0.55"/>

  <!-- eye -->
  <circle cx="382" cy="402" r="18" fill="#0C0B10"/>
  <circle cx="382" cy="402" r="22" stroke="#9FC6FF" stroke-width="4" opacity="0.85"/>
  <circle cx="388" cy="396" r="5.5" fill="#FFFFFF" opacity="0.95"/>

  <!-- blue crown highlight -->
  <path d="M322 362C352 330 396 314 440 322C470 328 492 342 506 362" stroke="#BBD6FF" stroke-width="10" stroke-linecap="round" opacity="0.4"/>

  <!-- rump blue patch -->
  <path d="M620 640C654 638 682 654 696 680C706 700 702 722 688 738C672 706 646 676 614 660Z" fill="#4C7BFF" opacity="0.9"/>

  <!-- legs and feet -->
  <path d="M476 774L468 802M540 768L552 802" stroke="#2B1D31" stroke-width="11" stroke-linecap="round"/>
  <path d="M446 808C458 800 470 800 482 808M528 808C540 800 552 800 564 808" stroke="#2B1D31" stroke-width="9" stroke-linecap="round"/>

  <!-- soft top light on tile -->
  <path d="M96 260C96 210 210 96 260 96H764C814 96 928 210 928 260" stroke="#FFFFFF" stroke-width="3" opacity="0.08"/>
</svg>
