  <path d="M496 518C556 492 626 520 662 578C694 630 686 700 644 738C610 768 558 760 532 722C500 676 480 590 496 518Z" fill="#8E4A2E"/>
  <path d="M508 538C558 514 614 536 646 582C670 618 668 664 646 696C624 728 584 736 556 712C524 684 504 612 508 538Z" fill="url(#wing)"/>
  <path d="M536 546C572 528 610 544 636 578C652 600 656 628 646 652C634 628 612 606 584 592C562 580 546 566 536 546Z" fill="url(#wingLight)"/>
  <path d="M554 726C592 724 626 704 648 674" stroke="#5E2D1E" stroke-width="10" stroke-linecap="round" opacity="0.55"/>

  <!-- head -->
  <circle cx="402" cy="426" r="124" fill="url(#blue)"/>
  <path d="M502 468C530 502 538 552 520 594C496 646 438 674 384 660C330 646 300 596 310 542C318 494 354 462 398 458C436 454 476 442 502 468Z" fill="url(#blueDeep)"/>

