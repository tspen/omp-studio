  <path d="M294 424C318 380 368 350 424 350C462 350 492 362 514 386C520 396 518 410 508 418C486 434 458 440 430 436C390 430 350 444 320 470C306 456 296 440 294 424Z" fill="#121019"/>
  <path d="M318 514C350 484 394 470 440 474C478 478 506 494 520 520C536 550 532 590 512 618C488 652 446 666 406 654C362 642 334 606 330 564C328 546 320 530 318 514Z" fill="#121019"/>

