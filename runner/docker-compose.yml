# Self-hosted Perch runner.
#
#   docker compose -f runner/docker-compose.yml up -d --build
#   docker compose -f runner/docker-compose.yml logs runner | grep "pairing link"
#
# The port is bound to loopback by default. Reach it from your phone through
# Tailscale (`tailscale serve --bg 43120` on the host) or a reverse proxy you
# control. Nothing is exposed publicly.
services:
  runner:
    build:
      context: ..
      dockerfile: runner/Dockerfile
    image: perch-runner:local
    container_name: perch-runner
    restart: unless-stopped
    labels:
      perch.managed: "true"
      perch.runner: "docker"
      perch.kind: "container"
    ports:
      - "${PERCH_RUNNER_BIND:-127.0.0.1}:${PERCH_RUNNER_PORT:-43120}:43120"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PERCH_REMOTE_TOKEN: ${PERCH_REMOTE_TOKEN:-}
      PERCH_REMOTE_HOST: 0.0.0.0
      PERCH_REMOTE_PORT: "43120"
      PERCH_USER_DATA: /data
      HOME: /data
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      PERCH_RELAY_URL: ${PERCH_RELAY_URL:-}
      PERCH_RELAY_ROOM: ${PERCH_RELAY_ROOM:-}
      PERCH_RELAY_TOKEN: ${PERCH_RELAY_TOKEN:-}
      PERCH_RELAY_SECRET: ${PERCH_RELAY_SECRET:-}
    volumes:
      - perch-data:/data
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

volumes:
  perch-data:
    labels:
      perch.managed: "true"
      perch.runner: "docker"
      perch.kind: "volume"




