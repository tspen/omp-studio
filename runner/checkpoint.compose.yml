# Optional live-checkpoint overlay for a Linux Docker runner.
#
#   CHECKPOINT_TOKEN=$(openssl rand -hex 24) \
#     docker compose -f runner/docker-compose.yml -f runner/checkpoint.compose.yml up -d --build
#
# Docker Desktop / WSL2 does not support this: Docker must run with
# "experimental": true and the host needs CRIU 4.x. The runner uses host
# networking because Docker cannot restore container port mappings with CRIU.
services:
  runner:
    network_mode: host
    ports: !reset []
    environment:
      OMP_REMOTE_HOST: 127.0.0.1
      OMP_REMOTE_PORT: "43120"

  checkpoint-agent:
    image: node:22-alpine
    container_name: omp-checkpoint-agent
    network_mode: host
    command: ["node", "/app/checkpoint-agent.mjs"]
    restart: unless-stopped
    labels:
      omp.managed: "true"
      omp.runner: "checkpoint"
      omp.kind: "container"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./checkpoint-agent.mjs:/app/checkpoint-agent.mjs:ro
    environment:
      CHECKPOINT_HOST: 127.0.0.1
      CHECKPOINT_PORT: "43160"
      CHECKPOINT_TOKEN: ${CHECKPOINT_TOKEN:?set CHECKPOINT_TOKEN}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
