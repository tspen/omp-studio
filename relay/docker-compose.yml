# Self-hosted Perch relay. It stores nothing and only forwards encrypted frames.
#
#   docker compose -f relay/docker-compose.yml up -d --build
#
# Bind stays on loopback. Reach it through Tailscale or a TLS reverse proxy you
# control; never publish it directly to the public internet.
services:
  relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    image: perch-relay:local
    container_name: perch-relay
    restart: unless-stopped
    labels:
      perch.managed: "true"
      perch.runner: "relay"
      perch.kind: "container"
    ports:
      - "${PERCH_RELAY_BIND:-127.0.0.1}:${PERCH_RELAY_PORT:-43150}:43150"
    environment:
      RELAY_HOST: 0.0.0.0
      RELAY_PORT: "43150"
      RELAY_MAX_CLIENTS: "8"
      RELAY_MAX_FRAME: "33554432"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
